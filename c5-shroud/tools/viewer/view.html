<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#f3f4f6}canvas{display:block}</style></head>
<body><canvas id="c" width="1200" height="760"></canvas>
<script src="lib/three.min.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const canvas = document.getElementById("c");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(1200, 760, false); renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene(); scene.background = new THREE.Color(q.get("bg") ? parseInt(q.get("bg"),16) : 0xf3f4f6);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 0.85));
  const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(300, 500, 400); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-400, 200, -300); scene.add(fill);
  const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.6, metalness: 0.05, flatShading: q.get("smooth") ? false : true }, o));
  async function part(url, m, edges = true) {
    const d = await (await fetch(url)).json();
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(d.p, 3)); g.setIndex(d.i); g.computeVertexNormals();
    if (d.c) g.setAttribute("color", new THREE.Float32BufferAttribute(d.c, 3));
    const grp = new THREE.Group(); grp.add(new THREE.Mesh(g, m));
    if (edges) grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 35), new THREE.LineBasicMaterial({ color: 0x1b1d20, transparent: true, opacity: 0.3 })));
    return grp;
  }
  const side = q.get("side") || "driver"; const dir = q.get("dir") || "parts";
  if (q.get("carrier") !== "0") scene.add(await part(`${dir}/carrier_${side}.json`, mat(q.get("carcol") ? parseInt(q.get("carcol"),16) : 0x5b8bd6)));
  if (q.get("gloss") || q.get("satin")) {      // a studio of soft boxes for the gloss finish to reflect
    const env = new THREE.Scene(); env.background = new THREE.Color(0x060708);
    const box = (w, h, x, y, z, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); };
    box(60, 14, 0, 40, 30, 0xffffff); box(14, 40, -40, 10, 20, 0x9aa2ad); box(40, 10, 30, 20, -30, 0x7d8590); box(200, 200, 0, -60, 0, 0x15171a);
    const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(env, 0.02).texture;
  }
  const shroudMat = q.get("satin") ? new THREE.MeshPhysicalMaterial({ color: 0x0d0d0e, roughness: 0.48, metalness: 0.0, clearcoat: 0.35, clearcoatRoughness: 0.45 }) : q.get("gloss") ? new THREE.MeshPhysicalMaterial({ color: 0x0b0b0c, roughness: 0.16, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.06 })
    : (q.get("black") ? mat(0x141416, { roughness: 0.95, metalness: 0.0, flatShading: false }) : mat(0x2d2f33));
  if (q.get("shroud") !== "0") scene.add(await part(`${dir}/shroud_${side}.json`, shroudMat));
  if (q.get("pods") !== "0") {
    const podc = q.get("podcol") ? parseInt(q.get("podcol"), 16) : 0xd2a92c;
    scene.add(await part(`${dir}/pods_${side}.json`, mat(podc, q.get("podcol") ? { flatShading: false, roughness: 0.5 } : {}), !q.get("podcol")));
    scene.add(await part(`${dir}/lenses_${side}.json`, q.get("glass") ? new THREE.MeshPhysicalMaterial({ color: 0x0c0e12, roughness: 0.04, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.02 })
      : mat(0xf7f7f2, { emissive: 0xfffdf2, emissiveIntensity: q.get("glow") ? +q.get("glow") : 0.4 }), !q.get("podcol")));
  }
  if (q.get("drl") === "1")         // the frosted diffuser inserts, lit
    scene.add(await part(`${dir}/drl_${side}.json`, mat(q.get('drlcol') ? parseInt(q.get('drlcol'),16) : 0xeaf4ff, { emissive: q.get('drlcol') ? parseInt(q.get('drlcol'),16) : 0xeaf4ff, emissiveIntensity: +(q.get("drlglow") || 1.0), flatShading: false }), false));
  if (q.get("cover") === "1") {
    const op = +(q.get("coverop") || 1);
    scene.add(await part(`${dir}/cover_${side}.json`, mat(q.get("covercol") ? parseInt(q.get("covercol"), 16) : 0xb3202a, { side: THREE.DoubleSide, transparent: op < 1, opacity: op, roughness: 0.35, metalness: 0.2, flatShading: false })));
  }
  if (q.get("car") === "1")        // the car scan (C5 Corvette by RYDNESS, Sketchfab, CC BY 4.0)
    scene.add(await part(`${dir}/car_${side}.json`, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.45, metalness: 0.15, side: THREE.DoubleSide }), false));
  const cam = new THREE.PerspectiveCamera(+(q.get("fov") || 30), 1200 / 760, 5, 20000);
  cam.position.set(...q.get("pos").split(",").map(Number)); cam.lookAt(...(q.get("tgt") || "0,20,-30").split(",").map(Number));
  renderer.render(scene, cam); window.ready = true;
})();
</script></body></html>
